server {
    listen 8080;

    # Rota para o Nó 1 (1.00 CPU - Alta Capacidade)
    location /node1 {
        proxy_pass http://node1:80/;
        proxy_set_header Host $host;
        proxy_set_header X-Target-Node "node1";
        add_header X-Upstream-Node "node1 (1.00 CPU)";
    }

    # Rota para o Nó 2 (0.25 CPU - Capacidade Intermediária)
    # Usa o parametro nativo ?wait= do traefik/whoami combinado ao limite de CPU do cgroup
    location /node2 {
        proxy_pass http://node2:80/?wait=140ms;
        proxy_set_header Host $host;
        proxy_set_header X-Target-Node "node2";
        add_header X-Upstream-Node "node2 (0.25 CPU)";
    }

    # Rota para o Nó 3 (0.05 CPU - Estrangulado / Alta chance de Timeout > 500ms)
    location /node3 {
        proxy_pass http://node3:80/?wait=620ms;
        proxy_set_header Host $host;
        proxy_set_header X-Target-Node "node3";
        add_header X-Upstream-Node "node3 (0.05 CPU)";
    }
}
